name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 tesseract-ocr
      - run: pip install -e ".[dev,recognise]"
      # Exit code 5 means no tests were collected yet; treat that as a pass.
      - run: pytest -q || [ $? -eq 5 ]
