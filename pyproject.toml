[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bjds"
version = "0.1.0"
description = "Blackjack decision support with a human in the loop (CST8327)"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
recognise = ["numpy>=2", "opencv-python>=4.10", "pytesseract>=0.3.13", "mss>=10"]

[tool.setuptools.packages.find]
include = ["bjds*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
